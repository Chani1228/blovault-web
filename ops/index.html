<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BLO VAULT Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Design: "vault ledger" operations console. Light is primary (brand blue accent), semantic state colors stay separate from the accent.
   Layout: sticky header + tab bar, one tab panel at a time; summary tiles first, charts next, detail tables last.
   Memorable element: the vault-dial brand mark and the faint concentric rings behind sign-in. Everything else stays quiet. */
:root{
  color-scheme:light;
  /* neutrals */
  --bg:#FBFCFE; --surface:#FFFFFF; --sunken:#F1F3F8; --hover:#F6F8FC; --line:#E3E7EE; --line2:#CBD2DE; --grid:#E9EDF3;
  --fg:#0E1422; --fg2:#3E475A; --fg3:#596377;
  /* accent + semantic + series */
  --accent:#2453FF; --on-accent:#FFFFFF; --accent-soft:rgba(36,83,255,.14); --accent-bg:#E8EDFF;
  --good:#0B7550; --warn:#8C6000; --bad:#C42F35; --violet:#6D4CE0; --teal:#0F7C70;
  --good-bg:#E6F4EE; --warn-bg:#FBF1DC; --bad-bg:#FBE8E8;
  /* elevation */
  --sh1:0 1px 2px rgba(14,20,34,.05); --sh2:0 1px 2px rgba(14,20,34,.04),0 8px 20px -10px rgba(14,20,34,.16); --sh3:0 2px 4px rgba(14,20,34,.05),0 24px 48px -20px rgba(36,83,255,.28);
  /* type */
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --display:"Bricolage Grotesque","Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* radius + spacing scale */
  --r-sm:8px; --r-md:10px; --r-lg:14px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F131B; --surface:#161B26; --sunken:#1D2436; --hover:#1A2130; --line:#2A3242; --line2:#3A455A; --grid:#232A38;
  --fg:#F5F7FB; --fg2:#B4BDCC; --fg3:#9CA6B8;
  --accent:#7C9BFF; --on-accent:#0F131B; --accent-soft:rgba(124,155,255,.22); --accent-bg:#1C2750;
  --good:#3DD68C; --warn:#F5B83D; --bad:#FF6B6E; --violet:#B9A6FF; --teal:#2CC9B5;
  --good-bg:#12302A; --warn-bg:#33290F; --bad-bg:#3A1A1E;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 1px 2px rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.6); --sh3:0 2px 4px rgba(0,0,0,.4),0 24px 48px -20px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F131B; --surface:#161B26; --sunken:#1D2436; --hover:#1A2130; --line:#2A3242; --line2:#3A455A; --grid:#232A38;
  --fg:#F5F7FB; --fg2:#B4BDCC; --fg3:#9CA6B8;
  --accent:#7C9BFF; --on-accent:#0F131B; --accent-soft:rgba(124,155,255,.22); --accent-bg:#1C2750;
  --good:#3DD68C; --warn:#F5B83D; --bad:#FF6B6E; --violet:#B9A6FF; --teal:#2CC9B5;
  --good-bg:#12302A; --warn-bg:#33290F; --bad-bg:#3A1A1E;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 1px 2px rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.6); --sh3:0 2px 4px rgba(0,0,0,.4),0 24px 48px -20px rgba(0,0,0,.7)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
::selection{background:var(--accent-soft);color:var(--fg)}
input,button{accent-color:var(--accent);caret-color:var(--accent)}
.tablebox,nav.tabs{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
th,td,.kpi,.bar,.count,.legend{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}
h2{font-size:17px;font-weight:650;letter-spacing:-.005em;text-wrap:balance}
h3{font-size:14px;font-weight:600;color:var(--fg2)}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.unote{display:block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usub{display:block;font-size:11px;color:var(--fg3)}

/* brand */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;flex:none;display:block}
.mark .bg{fill:var(--accent)} .mark .fg{stroke:var(--on-accent);fill:none;stroke-width:2;stroke-linecap:round} .mark .dot{fill:var(--on-accent)}
.word{font-family:var(--display);font-weight:780;font-size:19px;letter-spacing:.03em;color:var(--fg);line-height:1}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:2px 9px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh1)}
.topin{max-width:1200px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--s2)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.hrow .brand{flex:1 1 auto}
.hacts{display:flex;gap:var(--s2);align-items:center;order:2}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);min-width:0;order:3;flex:1 1 100%;font-size:13px;color:var(--fg3)}
.fresh{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;background:var(--sunken);color:var(--fg2);font-size:13px;font-weight:500;max-width:100%}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--fg3);flex:none}
.fresh[data-state="good"] .dot{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.fresh[data-state="warn"] .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.fresh #staleness{font-weight:650;color:var(--fg)}
.fresh[data-state="good"] #staleness{color:var(--good)} .fresh[data-state="warn"] #staleness{color:var(--warn)}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:860px){
  .hrow .brand{flex:0 0 auto}
  .hmeta{order:2;flex:1 1 auto;justify-content:flex-end}
  .hacts{order:3}
}

/* tabs */
.tabwrap{position:relative;margin-inline:-4px}
.tabwrap::before,.tabwrap::after{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none;z-index:1;opacity:0;transition:opacity .15s}
.tabwrap::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.tabwrap::after{right:0;background:linear-gradient(270deg,var(--surface),transparent)}
.tabwrap.more-l::before,.tabwrap.more-r::after{opacity:1}
nav.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs{scrollbar-width:none} nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{position:relative;font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--fg3);padding:0 14px;cursor:pointer;white-space:nowrap;min-height:44px;display:flex;align-items:center;gap:8px;border-radius:var(--r-sm) var(--r-sm) 0 0}
nav.tabs button:hover{color:var(--fg);background:var(--hover)}
nav.tabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .18s ease}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"]::after{transform:scaleX(1)}
nav.tabs button:focus-visible{outline-offset:-2px}
.count{font-size:11.5px;font-weight:650;background:var(--sunken);color:var(--fg2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"] .count{background:var(--accent-bg);color:var(--accent)}

main{max-width:1200px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:var(--s5) 64px}
.panel{display:flex;flex-direction:column;gap:var(--s5)}
.panel:focus-visible{outline-offset:6px;border-radius:var(--r-md)}
section{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--accent-bg);color:var(--accent)}
.pill.mute{background:var(--sunken);color:var(--fg2)}
.pill.cat{background:transparent;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2);font-weight:500;border-radius:var(--r-sm)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.kpis>:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:900px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis:has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis:has(>:nth-child(5):last-child){grid-template-columns:repeat(5,minmax(0,1fr))}
  .kpis>:last-child:nth-child(odd){grid-column:auto}
}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label ico" "value value" "sub sub";align-content:space-between;row-gap:6px;min-width:0;min-height:116px;box-shadow:var(--sh2)}
.kpi .label{grid-area:label;font-size:13px;color:var(--fg2);font-weight:600;align-self:center}
.kpi .ico{grid-area:ico;width:32px;height:32px;border-radius:var(--r-md);background:var(--sunken);color:var(--fg2);display:grid;place-items:center}
.kpi .ico .i{width:18px;height:18px}
.kpi .value{grid-area:value;font-size:26px;line-height:1.15;font-weight:650;letter-spacing:-.015em;overflow-wrap:anywhere}
.kpi .sub{grid-area:sub;font-size:13px;color:var(--fg3);min-height:1.5em}
.kpi .sub:empty::before{content:"\00a0"}

/* boxes + charts */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:var(--s3)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0;box-shadow:var(--sh1)}
.box.wide{grid-column:1/-1}
.grid2.g22{grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.grid2.g22{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart svg{display:block;width:100%;height:auto;max-width:520px;overflow:visible}
.chart text{fill:var(--fg3);font-family:var(--sans);font-size:11px;font-variant-numeric:tabular-nums}
.chart text.ev{fill:var(--fg);font-weight:650}
.legend{display:flex;gap:var(--s2) var(--s4);flex-wrap:wrap;font-size:13px;color:var(--fg2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(88px,150px) minmax(0,1fr) auto;gap:var(--s3);align-items:center;font-size:14px}
.bar>span:first-child{overflow-wrap:anywhere}
.bar .track{height:10px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:var(--accent);min-width:2px}
.bar .num{font-family:var(--mono);font-size:12.5px;color:var(--fg2);text-align:right}
.note{font-size:13px;color:var(--fg3)}
.note .mono{background:var(--sunken);color:var(--fg);padding:1px 6px;border-radius:6px}

/* attention list */
.attn{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--sh1)}
.attn .row{display:flex;gap:var(--s3);align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.attn .row:first-child{border-top:0}
.attn .row .pill{min-width:58px;justify-content:center}
.attn .row .txt{min-width:0;flex:1;overflow-wrap:anywhere}

/* empty / states */
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center;color:var(--fg2);padding:var(--s5) var(--s4);border:1px dashed var(--line2);border-radius:var(--r-lg);background:var(--surface)}
.empty .eico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--good-bg);color:var(--good)}
.empty .eico.neutral{background:var(--sunken);color:var(--fg3)}
.empty .eico .i{width:20px;height:20px}
.empty p+p{color:var(--fg3);font-size:13px}
.sk{position:relative;overflow:hidden}
.skl{display:block;height:12px;width:50%;border-radius:6px;background:var(--sunken);position:relative;overflow:hidden}
.skl.h22{height:26px;border-radius:8px} .skl.w40{width:40%} .skl.w55{width:55%} .skl.w70{width:70%} .skl.block{width:100%;height:120px;border-radius:var(--r-md)}
.skl::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--hover),transparent)}
.sk.kpi{gap:10px;grid-template-areas:none;display:flex;flex-direction:column;justify-content:center}
.sk.box{gap:14px}
@media (prefers-reduced-motion:no-preference){
  .skl::after{animation:shim 1.4s infinite}
  .spin .i{animation:spin 1s linear infinite}
  .btn{transition:border-color .15s,color .15s,background-color .15s,box-shadow .15s}
  .bar .fill{transition:width .3s ease}
}
@keyframes shim{to{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* tables */
.tablebox{overflow:auto;max-height:min(68vh,620px);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh1);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
thead th{position:sticky;top:0;z-index:1;background:var(--sunken);border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--fg3);font-weight:650;white-space:nowrap}
td.r,th.r{text-align:right}
td.num{font-family:var(--mono);font-size:13px}
td.tempty{text-align:center;padding:28px 14px;color:var(--fg3)}
td.note{font-size:13px}

/* bug cards */
.fb{display:flex;flex-direction:column;gap:var(--s3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:var(--s3);min-width:0;box-shadow:var(--sh1)}
.card .ctop{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.card .ctop .note{flex-basis:100%;margin-top:2px}
@media (min-width:640px){.card .ctop .note{flex-basis:auto;margin:0 0 0 auto}}
.card .msg{white-space:pre-wrap;overflow-wrap:anywhere;max-width:80ch}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;padding:3px;background:var(--sunken);border-radius:var(--r-md);align-self:stretch;max-width:100%}
.seg .btn{border-color:transparent;background:transparent;box-shadow:none;border-radius:var(--r-sm);padding-inline:1px;font-size:12px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:block;text-align:center}
.seg .btn:hover{background:var(--hover);border-color:transparent;color:var(--fg)}
.seg .btn[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--sh2);border-color:var(--line)}
.filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters .btn{border-radius:999px;padding-inline:14px;flex:0 0 auto}
@media (max-width:639px){.sechead:has(>.filters){flex-direction:column;align-items:stretch}}

/* inbox + beta */
.srcb{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--fg2)}
.srcb.email{background:var(--accent-bg);color:var(--accent)}
.srcb .i{width:14px;height:14px}
.ctitle{font-weight:650;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--fg3);overflow-wrap:anywhere}
.anote{font-size:13px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.reply .addr{font-family:var(--mono);font-size:13px;background:var(--sunken);border-radius:var(--r-sm);padding:6px 10px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere;min-width:0}
.reply a.btn{text-decoration:none}
.cacts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.diag{font-family:var(--mono);font-size:12px;line-height:1.45;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin:0;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.field textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--bg);color:var(--fg);width:100%;min-height:96px;resize:vertical}
.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tester .trow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.tester .tname{font-weight:650;overflow-wrap:anywhere;min-width:0}
.tester .tsub{font-size:13px;color:var(--fg3)}
.tester .tsub.warn{color:var(--warn);font-weight:600} .tester .tsub.bad{color:var(--bad);font-weight:600}
.cta{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.cta .btn.primary{min-height:48px;padding-inline:22px;font-size:15px}

.flag{display:flex;align-items:center;gap:var(--s3);justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.flag:first-of-type{border-top:0}
.flag .ftxt{min-width:0;display:flex;flex-direction:column;gap:2px}
.flag .fname{font-weight:650;overflow-wrap:anywhere}
.flag .fsub{font-size:12.5px;color:var(--fg3)}
.sw{flex:0 0 auto;position:relative;width:64px;min-height:44px;border:0;background:transparent;cursor:pointer;padding:0}
.sw::before{content:"";position:absolute;left:0;top:50%;width:64px;height:30px;margin-top:-15px;border-radius:999px;background:var(--line2);transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]::before{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(34px)}
.sw .swl{position:absolute;top:50%;margin-top:-8px;font-size:11px;line-height:16px;font-weight:700;color:var(--fg2);right:9px;z-index:1;pointer-events:none}
.sw[aria-checked="true"] .swl{right:auto;left:9px;color:var(--on-accent)}
.sw:disabled{opacity:.55;cursor:default}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}

/* buttons */

    const on=!x.feature_preview;
    openModal({title:on?'See hidden features':'Stop seeing hidden features',
      intro:userLine(x)+(on?'<p>This user will see every feature, including ones turned off for testers. It does not give any admin access.</p>':'<p>This user will only see the features that are turned on for testers.</p>'),
      fields:idFields(x),validate:v=>uidCheck(x,v),submit:on?'Turn on':'Turn off',toast:on?'Hidden features are now visible to this user':'This user no longer sees hidden features',
      run:v=>api(on?'add_feature_preview':'remove_feature_preview',{user_id:uidOf(x,v)})},btn);
  }
  function actDelete(x,btn){
    openModal({title:'Delete user',danger:true,
      intro:userLine(x)+'<div class="callout bad">This permanently deletes the account. It cannot be undone.</div><p>It removes the user’s bank connections at Plaid, deletes their data on the server, and deletes the account. Bank connections that were linked outside a Plaid user session cannot be removed from the server; they are shown as a count afterwards so you can remove them in the Plaid dashboard.</p>',
      fields:idFields(x),confirmText:v=>uidOf(x,v).slice(0,8),validate:v=>uidCheck(x,v),submit:'Delete user',
      toast:r=>n0(r&&r.kept_unassociated_items)?'Data deleted; '+n0(r.kept_unassociated_items)+' bank connection(s) kept':'User deleted',
      run:(v,pv,extra)=>api('delete_user',Object.assign({user_id:uidOf(x,v),confirm:uidOf(x,v).slice(0,8)},extra||{})),
      onError:err=>{
        const b=err.body||{};
        if(err.status===409&&b.error==='unassociated_items'){
          const ids=Array.isArray(b.item_ids_short)?b.item_ids_short:[];
          return {html:`<div class="callout bad"><b>${n0(b.count)||ids.length} bank connection(s) are not attached to a Plaid user.</b>${ids.length?'<br>Item ids: <span class="mono">'+ids.map(esc).join(', ')+'</span>':''}<br>These connections can only be removed from the user’s app or the Plaid dashboard; deleting now would leave them billing.</div>`,
            altLabel:'Delete anyway, keep those connections',error:''};
        }
        if(err.status===502&&b.error==='plaid_terminate_failed') return {html:'',subLabel:'Retry',error:'Nothing was deleted. Plaid could not remove the bank connections'+(b.plaid_error?': '+(typeof b.plaid_error==='string'?b.plaid_error:JSON.stringify(b.plaid_error)):'.')};
        return null;
      },
      done:r=>{if(n0(r.kept_unassociated_items)) return `<div class="callout">The user’s data was deleted, but ${n0(r.kept_unassociated_items)} bank connection(s) were kept and may still bill. The login account was not deleted${r.auth_user_deleted===false?' (auth_user_deleted: false)':''}. Remove the connections in ${lnk('plaidDebugger','the Plaid Item Debugger')}.</div><h3>Deleted rows</h3>${kvHtml(r.deleted_rows)}`;
const p={terminated:'Bank connections were removed at Plaid.',no_plaid_user:'No Plaid user on record, so no bank connections were removed.',failed:'Plaid removal failed. Check the Plaid dashboard.'}[r.plaid]||('Plaid: '+esc(r.plaid||'unknown'));
        const un=n0(r.unassociated_items);
        return `<p>${esc(p)}</p>${un?`<div class="callout">${un} bank connection(s) were linked outside a Plaid user session and still exist. Remove them in ${lnk('plaidDebugger','the Plaid Item Debugger')}.</div>`:''}<h3>Deleted rows</h3>${kvHtml(r.deleted_rows)}`;}},btn);
  }
  function actReassign(x,btn){
    openModal({title:'Move data to another user',danger:true,
      intro:userLine(x)+'<p>Moves bank connections, accounts, sync flags and feedback from this user to another user. You will see what changes before anything is moved.</p>',
      fields:[...idFields(x),{name:'new_user_id',label:'New user id (full)',required:true}],
      previewLabel:'Preview move',
      validate:(v,ph)=>ph==='input'?(uidCheck(x,v)||(v.new_user_id.trim()===uidOf(x,v)?'The new user must be a different user.':'')):'',
      preview:async v=>{const r=await api('reassign_preview',{old_user_id:uidOf(x,v),new_user_id:v.new_user_id.trim()});
        const en=r.entitlement||{};
        return {force:r.new_has_active_items?'The new user already has active bank connections. Move anyway.':'',
          html:`<h3>Rows that will move</h3>${kvHtml(r.counts)}<h3>Access</h3><dl class="kv"><dt>Old user</dt><dd>${esc(fmtVal(en.old))}</dd><dt>New user</dt><dd>${esc(fmtVal(en.new))}</dd><dt>Result</dt><dd>${esc(fmtVal(en.result))}</dd></dl>${r.new_has_active_items?'<div class="callout">The new user already has active bank connections.</div>':''}`};},
      confirmText:v=>uidOf(x,v).slice(0,8),submit:'Move data',toast:'Data moved',
      run:(v,pv)=>{const b={old_user_id:uidOf(x,v),new_user_id:v.new_user_id.trim(),confirm:uidOf(x,v).slice(0,8)}; if(v.force) b.force=true; return api('reassign_user',b);},
      done:r=>`<p>Moved.</p>${kvHtml(r.moved)}`},btn);
  }
  function actInvite(btn){
    openModal({title:'New invite',intro:'<p>Creates a beta invite code. The full code is shown only once after you create it.</p>',
      fields:[{name:'pick',label:'Tier',type:'select',value:'permanent',options:[['permanent','Permanent'],['limited30','30-day'],['custom','Limited · custom days']]},{name:'days',label:'Number of days (1–365)',type:'number',min:1,max:365,value:'30',required:true,showIf:v=>v.pick==='custom'},{name:'note',label:'Name or note',hint:'Shown in the "For" column.'}],
      validate:v=>v.pick==='custom'&&!daysOf(v.days)?'Days must be a whole number from 1 to 365.':'',
      submit:'Create invite',toast:'Invite created',
      run:v=>{const b={tier:v.pick==='permanent'?'permanent':'limited',note:v.note.trim()}; if(b.tier==='limited') b.duration_days=v.pick==='custom'?daysOf(v.days):30; return api('create_invite',b);},
      done:r=>`<p>${r.tier==='limited'?'Limited · '+n0(r.duration_days)+' days':'Permanent'}${r.note?' · '+esc(r.note):''}</p><div class="field"><label for="mCode">Invite code</label><input id="mCode" readonly value="${esc(r.code)}"></div><div><button class="btn" type="button" data-copy>Copy code</button> <span class="note" id="mCopyMsg" role="status"></span></div><div class="callout">This is the only time the full code is shown. Copy it now.</div>`},btn);
  }
  function actRevokeInvite(x,btn){
    openModal({title:'Revoke invite',intro:`<p>Invalidates the unused code <b class="mono">${esc(x.code_masked)}</b>${x.note?' for '+esc(x.note):''}. Nobody will be able to redeem it.</p>`,
      danger:true,submit:'Revoke invite',toast:'Invite revoked',
      run:()=>api('revoke_invite',{code_masked_prefix:x.code_masked_prefix||x.code_masked,created_at:x.created_at})},btn);
  }
  function actMode(btn){
    const m=reaperMode(); if(!m) return; const toLive=m!=='live', word=toLive?'LIVE':'DRY RUN';
    openModal({title:toLive?'Switch cleanup job to live':'Switch cleanup job to dry run',danger:toLive,
      intro:toLive?'<div class="callout bad">Live mode removes real bank connections at Plaid for users the job decides to remove, and this cannot be undone.</div><p>Check the latest dry-run decisions first.</p>':'<p>The job will only record what it would remove. Nothing is removed at Plaid.</p>',
      confirmText:word,submit:toLive?'Switch to live':'Switch to dry run',toast:toLive?'Cleanup job is now live':'Cleanup job is now dry run',
      run:()=>api('set_reaper_mode',{mode:toLive?'live':'dry_run',confirm:word})},btn);
  }
  function actRun(btn){
    const live=reaperMode()==='live';
    openModal({title:'Run cleanup job now',
      intro:live?'<div class="callout bad">The job is in live mode. This run removes real bank connections at Plaid.</div>':'<p>The job is in dry-run mode. This run only records what it would remove.</p>',
      danger:live,submit:'Run now',toast:'Cleanup run finished',
      run:()=>api('run_reaper',{}),
      done:r=>`<p>Run finished. Summary:</p>${kvHtml(r.result)}`},btn);
  }
  function actShot(id,btn){
    const it=(snap.feedback?.items||[]).find(x=>x.id===id); if(!it||!/^https:\/\//.test(it.screenshot_url||'')) return;
    openModal({title:'Screenshot',wide:true,closeOnly:true,html:`<img class="lbimg" src="${esc(it.screenshot_url)}" alt="Screenshot attached to this report"><p class="note">This link expires after about 10 minutes. <a href="${esc(it.screenshot_url)}" target="_blank" rel="noopener">Open in a new tab</a></p>`},btn);
  }
  function actDetail(id,btn){
    busy['d'+id]=true; render();
    api('feedback_detail',{id}).then(d=>{
      delete busy['d'+id]; render();
      const li=(snap.feedback?.items||[]).find(x=>x.id===id)||{}, x=Object.assign({},li,d||{}), em=srcOf(x)==='email', mt=metaLine(x), st=statusMeta(x.status);
      const shot=/^https:\/\//.test(x.screenshot_url||'')?x.screenshot_url:'';
      const intro=`<div class="ctop">${srcBadge(x)}<span class="pill ${st[2]}">${esc(st[1])}</span><span class="note">${fmtDT(x.created_at)}</span></div>`
        +(em?`<div class="ctitle">${esc(x.email_subject||'(no subject)')}</div>${x.email_from?`<div class="note">From ${esc(x.email_from)}</div>`:''}`:'')
        +`<div class="msg" style="white-space:pre-wrap">${esc(x.message)}</div>`+replyHtml(x)
        +(mt||x.user_short?`<div class="meta">${esc([mt,x.user_short?'user '+x.user_short:''].filter(Boolean).join(' \u00b7 '))}</div>`:'')
        +(x.diagnostics?`<h3>Diagnostics</h3><pre class="diag" tabindex="0">${esc(x.diagnostics)}</pre>`:'')
        +(shot?`<a class="shot" href="${esc(shot)}" target="_blank" rel="noopener" aria-label="Open screenshot in a new tab"><img src="${esc(shot)}" alt="Screenshot attached to this report"></a>`:'');
      const cats=['Problem','Improvement','Other']; if(x.category&&!cats.includes(x.category)) cats.push(x.category);
      openModal({title:'Inbox item',wide:true,intro,
        fields:[{name:'category',label:'Category',type:'select',value:x.category||'Other',options:cats.map(c=>[c,c])},{name:'note',label:'Admin note (only you can see this)',type:'textarea',max:4000,value:x.admin_note||''}],
        submit:'Save',toast:'Saved',
        run:async v=>{
          if(v.category!==(x.category||'Other')){await api('set_feedback_category',{id,category:v.category}); if(li) li.category=v.category;}
          if(v.note!==(x.admin_note||'')){await api('set_feedback_note',{id,note:v.note}); if(li) li.admin_note=v.note||null;}
          return {ok:true};}},btn);
    }).catch(err=>{delete busy['d'+id]; render(); toast(errMsg(err));});
  }
  async function copyAddr(btn){
    const a=btn.dataset.copyaddr, el=btn.parentElement.querySelector('.addr'); let ok=false;
    try{await navigator.clipboard.writeText(a);ok=true;}catch(x){}
    if(!ok&&el){const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);try{ok=document.execCommand('copy')}catch(x){}}
    toast(ok?'Address copied':'Address selected. Press Ctrl/Cmd+C to copy.');
  }
  function actPermanent(x,btn){
    const u=x.u;
    openModal({title:'Make permanent',intro:userLine(u)+'<p>Replaces the current beta access with permanent beta access (no expiry).</p>',
      fields:idFields(u),validate:v=>uidCheck(u,v),submit:'Make permanent',toast:'Access is now permanent',
      run:v=>api('grant_entitlement',{user_id:uidOf(u,v),source:'beta_permanent'})},btn);
  }
  function actEnd(x,btn){
    const u=x.u;
    openModal({title:'End access',danger:true,intro:userLine(u)+'<p>Removes the beta access now. The user keeps the account and any paid App Store subscription.</p>',
      fields:idFields(u),confirmText:v=>(uidOf(u,v)||u.short||'').slice(0,8),validate:v=>uidCheck(u,v),submit:'End access',toast:'Access ended',
      run:v=>api('revoke_entitlement',{user_id:uidOf(u,v)})},btn);
  }
  async function quickExtend(x,btn){
    const u=x.u; if(!(u.user_id||u.id)){actExtend(u,btn);return;}
    btn.disabled=true;
    try{const r=await api('extend_entitlement',{user_id:uidOf(u),days:30}); toast(r&&r.expires_at?'Extended until '+fmtDate(r.expires_at):'Extended by 30 days'); load();}
    catch(err){toast(errMsg(err)); btn.disabled=false;}
  }
  const MENU={grant:actGrant,extend:actExtend,revoke:actRevoke,reassign:actReassign,preview:actPreview,delete:actDelete};

  /* ---------- shell ---------- */
  function updateFade(){
    const nav=$('tabs'), w=$('tabwrap');
    w.classList.toggle('more-l',nav.scrollLeft>4);
    w.classList.toggle('more-r',nav.scrollLeft+nav.clientWidth<nav.scrollWidth-4);
  }
  function renderTabs(){
    const open=(snap.feedback?.items||[]).filter(isOpen).length, attn=attentionRows().length;
    const nav=$('tabs'), prev=nav.scrollLeft;
    nav.innerHTML=TABS.map(([k,l])=>{const c=k==='inbox'&&open?open:k==='overview'&&attn?attn:'';return `<button type="button" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${tab===k}" tabindex="${tab===k?0:-1}" data-tab="${k}">${esc(l)}${c?` <span class="count">${c}</span>`:''}</button>`}).join('');
    nav.scrollLeft=prev;
    const sel=$('tab-'+tab);
    if(sel){const l=sel.offsetLeft, r=l+sel.offsetWidth; if(l<nav.scrollLeft+16) nav.scrollLeft=Math.max(0,l-16); else if(r>nav.scrollLeft+nav.clientWidth-16) nav.scrollLeft=r-nav.clientWidth+16;}
    updateFade();
  }
  function render(){
    const signedIn=!!session;
    closeMenu();
    if(!signedIn&&M) closeModal();
    $('loginView').hidden=signedIn; $('appView').hidden=!signedIn;
    if(!signedIn) return;
    $('who').textContent=session.user?.email||'';
    $('who').title='Signed in as '+(session.user?.email||'');
    $('refreshBtn').disabled=loading; $('refreshBtn').classList.toggle('spin',loading); $('refreshLbl').textContent=loading?'Refreshing…':'Refresh';
    const g=snap.general||{};
    if(g.generated_at){$('snapAt').textContent='Snapshot '+fmtDT(g.generated_at);const h=(Date.now()-dOf(g.generated_at))/36e5;$('staleness').textContent=ago(g.generated_at);$('freshPill').dataset.state=h>24?'warn':'good';}
    renderTabs();
    if(denied){
      $('main').innerHTML=`<div class="empty"><span class="eico neutral">${svg('shield')}</span><p>This account is not an ops admin.</p><p>Sign out and use an admin account to continue.</p><button class="btn" type="button" data-signout="1">Sign out</button></div>`;
      return;
    }
    const banner=loadErr?`<div class="banner" role="alert"><span>${svg('alert')}${esc(loadErr)}</span><button class="btn" type="button" data-retry="1">Retry</button></div>`:'';
    if(!g.generated_at){
      $('main').innerHTML=banner+(loadErr?'':skeleton());
      return;
    }
    const secErr=['users','plaid','reaper','feedback','beta_invites','metrics'].filter(k=>snap[k]&&snap[k].error).map(k=>k+': '+snap[k].error);
    if(snap.webhook_flags_error) secErr.push('webhook_flags: '+snap.webhook_flags_error);
    const secBanner=secErr.length?`<div class="banner" role="alert"><span>${svg('alert')}Some sections failed: ${esc(secErr.join(' · '))}</span></div>`:'';
    $('main').innerHTML=banner+secBanner+`<div class="panel" id="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-${tab}">${P[tab]()}</div>`;
  }
  function go(k){tab=k;lsSet('ops_tab',k);if(location.hash.slice(1)!==k) history_replace(k);render();window.scrollTo(0,0);}
  function history_replace(k){try{window.history.replaceState(null,'','#'+k)}catch(e){location.hash=k}}

  function recordHistory(){
    const g=snap.general||{}; if(!g.generated_at) return;
    const hourKey=new Date().toISOString().slice(0,13);
    const pt={generated_at:g.generated_at,hour:hourKey,
      items_active:n0(snap.plaid?.active_items),items_billed:n0(snap.plaid?.billed_this_month??snap.plaid?.active_items),est_monthly_cost_usd:n0(snap.plaid?.est_monthly_cost_usd),
      users_total:n0(snap.users?.total),feedback_open:(snap.feedback?.items||[]).filter(isOpen).length};
    const last=history[history.length-1];
    if(last&&last.hour===hourKey) history[history.length-1]=pt; else history.push(pt);
    history=history.slice(-HIST_MAX);
    lsSet(HIST_KEY,JSON.stringify(history));
  }

  async function api(action,body){
    const { data:{ session:s } }=await sb.auth.getSession();
    if(!s) throw Object.assign(new Error('Signed out'),{status:401});
    const res=await fetch(API+'?action='+action,{method:'POST',headers:{'Authorization':'Bearer '+s.access_token,'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    let json=null; try{json=await res.json()}catch(e){}
    if(!res.ok) throw Object.assign(new Error((json&&(json.error||json.message))||('Request failed ('+res.status+')')),{status:res.status,body:json});
    return json;
  }
  async function load(){
    if(!session||loading) return;
    loading=true; render();
    try{
      const json=await api('snapshot',{});
      json.general={generated_at:json.generated_at};
      snap=json;
      denied=false; loadErr=''; lastLoadAt=Date.now();
      recordHistory();
    }catch(err){
      if(err.status===403){denied=true;loadErr='';}
      else if(err.status===401){loadErr='Session expired. Sign in again.';}
      else loadErr=(err instanceof TypeError)?'Network error — showing the last data.':'Could not load: '+err.message;
    }
    loading=false; render();
  }
  async function setStatus(id,status){
    busy[id]=true; delete cardErr[id]; render();
    try{
      await api('set_feedback_status',{id,status});
      const it=(snap.feedback?.items||[]).find(x=>x.id===id); if(it) it.status=status;
    }catch(err){cardErr[id]='Could not save: '+(err instanceof TypeError?'network error':err.message);}
    delete busy[id]; render();
    const nb=Array.from(document.querySelectorAll('[data-status]')).find(b=>b.dataset.id===id&&b.dataset.status===status); if(nb) nb.focus({preventScroll:true});
  }

  document.addEventListener('click',e=>{
    const mi=e.target.closest('[data-mi]');
    if(mi&&menu){const {x,btn}=menu; closeMenu(); MENU[mi.dataset.mi](x,btn); return;}
    const um=e.target.closest('[data-umenu]');
    if(um){ if(menu&&menu.btn===um) closeMenu(true); else openMenu(um); return; }
    if(menu&&!menu.el.contains(e.target)) closeMenu();
    const ac=e.target.closest('[data-act]');
    if(ac&&!ac.disabled){ const k=ac.dataset.act; if(k==='invite'||k==='invite-force'){ if(k==='invite-force') e.preventDefault(); actInvite(ac);} else if(k==='mode') actMode(ac); else if(k==='run') actRun(ac); return; }
    const fg=e.target.closest('[data-flag]'); if(fg){ if(!fg.disabled) toggleFlag(fg.dataset.flag,fg); return; }
    const iv=e.target.closest('[data-inv]');
    if(iv){ const x=(snap.beta_invites?.items||[])[+iv.dataset.inv]; if(x) actRevokeInvite(x,iv); return; }
    const dt=e.target.closest('[data-detail]'); if(dt){ if(!dt.disabled) actDetail(dt.dataset.detail,dt); return; }
    const ca=e.target.closest('[data-copyaddr]'); if(ca){ copyAddr(ca); return; }
    const tx=e.target.closest('[data-tx]'); if(tx){ const x=testerList()[+tx.dataset.ti]; if(x){ const k=tx.dataset.tx; if(k==='ext') quickExtend(x,tx); else if(k==='perm') actPermanent(x,tx); else actEnd(x,tx);} return; }
    const sh=e.target.closest('[data-shot]');
    if(sh){ actShot(sh.dataset.shot,sh); return; }
    const t=e.target.closest('[data-tab]'); if(t){go(t.dataset.tab);return;}
    const g=e.target.closest('[data-goto]'); if(g){go(g.dataset.goto);return;}
    const sr=e.target.closest('[data-source]'); if(sr){fbSource=sr.dataset.source;render();const ns=document.querySelector('[data-source="'+fbSource+'"]'); if(ns) ns.focus({preventScroll:true});return;}
    const f=e.target.closest('[data-filter]'); if(f){fbFilter=f.dataset.filter;render();const nf=document.querySelector('[data-filter="'+fbFilter+'"]'); if(nf) nf.focus({preventScroll:true});return;}
    if(e.target.closest('[data-retry]')){load();return;}
    if(e.target.closest('[data-signout]')){sb.auth.signOut();return;}
    const b=e.target.closest('[data-status]'); if(b&&!b.disabled) setStatus(b.dataset.id,b.dataset.status);
  });
  $('tabs').addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
    const i=TABS.findIndex(t=>t[0]===tab), n=TABS.length;
    const j=e.key==='Home'?0:e.key==='End'?n-1:e.key==='ArrowRight'?(i+1)%n:(i-1+n)%n;
    e.preventDefault(); go(TABS[j][0]);
    const nt=$('tab-'+TABS[j][0]); if(nt) nt.focus();
  });
  $('tabs').addEventListener('scroll',updateFade,{passive:true});
  window.addEventListener('resize',updateFade);
  $('refreshBtn').addEventListener('click',load);
  $('signOutBtn').addEventListener('click',()=>sb.auth.signOut());
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('loginBtn'); btn.disabled=true; btn.textContent='Signing in…'; $('loginErr').textContent='';
    try{
      const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
      if(error) $('loginErr').textContent=error.message||'Sign-in failed.';
      else $('password').value='';
    }catch(err){$('loginErr').textContent='Network error. Try again.';}
    btn.disabled=false; btn.textContent='Sign in';
  });
  window.addEventListener('hashchange',()=>{const k=tabAlias((location.hash||'').slice(1)); if(TABS.some(t=>t[0]===k)&&k!==tab){tab=k;lsSet('ops_tab',k);render();}});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&session&&Date.now()-lastLoadAt>60000) load(); });

  sb.auth.onAuthStateChange((event,s)=>{
    const was=session&&session.user?.id; session=s;
    if(!s){snap={};denied=false;loadErr='';lastLoadAt=0;render();return;}
    if(was!==s.user.id){ setTimeout(load,0); }
    render();
  });
  render();
})();
</script>
</body>
</html>
